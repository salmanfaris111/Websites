                // Simple tap (no downward drag): if menu was already open on touchstart, close it
                if (!titleDraggedDown && switcherWasOpenOnTouchStart) {
                    switcher.classList.remove('active');
                    _syncSwitcherOpenState();
                }

                _clearDragHover();
                titleTouchTracking = false;
                titleDraggedDown = false;
                switcherWasOpenOnTouchStart = false;
            });

            titleBtn.addEventListener('touchcancel', () => {
                _clearDragHover();
                titleTouchTracking = false;
                titleDraggedDown = false;
                switcherWasOpenOnTouchStart = false;
                _syncSwitcherOpenState();
            }, { passive: true });

            titleBtn.onclick = e => {
                e.stopPropagation();
                suppressBodyTapUntil = Date.now() + 300;
                if (Date.now() < suppressTitleClickUntil) return;
                md.classList.remove('active');
                _closeOpenSwipeRows(null);
                if (switcher.classList.contains('active')) {
                    switcher.classList.remove('active');
                    _syncSwitcherOpenState();
                    return;
                }
                _renderCounterSwitcher();
                switcher.classList.add('active');
                _syncSwitcherOpenState();
            };

            // Chrome-like press & swipe-down selection on top-right 3-dot menu button
            mb.addEventListener('touchstart', e => {
                if (lk || isLockout) return;
                e.stopPropagation();
                suppressBodyTapUntil = Date.now() + 400;
                switcher.classList.remove('active');
                _syncSwitcherOpenState();
                _closeOpenSwipeRows(null);

                menuTouchTracking = true;
                menuTouchStartY = e.touches[0].clientY;
                menuDraggedDown = false;
                menuWasOpenOnTouchStart = md.classList.contains('active');
                _clearDragHover();

                if (!menuWasOpenOnTouchStart) {
                    md.classList.add('active');
                }
            }, { passive: true });

            mb.addEventListener('touchmove', e => {
                if (!menuTouchTracking) return;
                e.stopPropagation();
                const touch = e.touches[0];
                if (touch.clientY - menuTouchStartY > 12) {
                    menuDraggedDown = true;
                }
                if (menuDraggedDown && md.classList.contains('active')) {
                    _updateDragHoverAtPoint(touch.clientX, touch.clientY);
                }
            }, { passive: true });

            mb.addEventListener('touchend', e => {
                if (!menuTouchTracking) return;
                e.stopPropagation();
                suppressBodyTapUntil = Date.now() + 400;
                suppressMenuClickUntil = Date.now() + 400;

                const changedTouch = e.changedTouches && e.changedTouches[0];
                if (changedTouch && menuDraggedDown && md.classList.contains('active')) {
                    _applyDragHoverNow(changedTouch.clientX, changedTouch.clientY);
                    const chosen = hoveredDragTarget;
                    _clearDragHover();
                    menuTouchTracking = false;
                    menuDraggedDown = false;
                    menuWasOpenOnTouchStart = false;

                    if (chosen && md.contains(chosen)) {
                        chosen.click();
                        return;
                    }
                }

                if (!menuDraggedDown && menuWasOpenOnTouchStart) {
                    md.classList.remove('active');
                }

                _clearDragHover();
                menuTouchTracking = false;
                menuDraggedDown = false;
                menuWasOpenOnTouchStart = false;
            });

            mb.addEventListener('touchcancel', () => {
                _clearDragHover();
                menuTouchTracking = false;
                menuDraggedDown = false;
                menuWasOpenOnTouchStart = false;
            }, { passive: true });

            newCounterMenu.onclick = e => {
                e.stopPropagation();
                suppressBodyTapUntil = Date.now() + 300;
                md.classList.remove('active');
                switcher.classList.remove('active');
                _syncSwitcherOpenState();
                _createCounter();
            };

            renameCounterMenu.onclick = e => {
                e.stopPropagation();
                suppressBodyTapUntil = Date.now() + 300;
                md.classList.remove('active');
                switcher.classList.remove('active');
                _syncSwitcherOpenState();
                _renameCounter(activeId);
            };

            deleteCounterMenu.onclick = e => {
                e.stopPropagation();
                suppressBodyTapUntil = Date.now() + 300;
                md.classList.remove('active');
                switcher.classList.remove('active');
                _syncSwitcherOpenState();
                _deleteCounter(activeId);
            };

            mb.onclick = e => {
                e.stopPropagation();
                suppressBodyTapUntil = Date.now() + 300;
                if (Date.now() < suppressMenuClickUntil) return;
                switcher.classList.remove('active');
                _syncSwitcherOpenState();
                _closeOpenSwipeRows(null);
                md.classList.toggle('active');
            };

            d.addEventListener('click', e => {
                if (!e.target.closest('.a2')) {
                    md.classList.remove('active');
                }
                if (!e.target.closest('#counter-switcher') && !e.target.closest('#x1')) {
                    switcher.classList.remove('active');
                    _syncSwitcherOpenState();
                }
                if (Date.now() < suppressBodyTapUntil) return;
                if (lk || isLockout) return;
                if (e.target.closest('.a2') || e.target.closest('.a1') || e.target.closest('.b3') || e.target.closest('#undo-toast') || e.target.closest('#counter-switcher') || e.target.closest('#lock-overlay') || e.target.closest('#goal-overlay')) return;
                if (f.contentEditable === 'true') return;
                _u();
                _incrementCounter();
            });

            d.querySelectorAll('.menu-item').forEach(btn => {
                btn.addEventListener('touchstart', () => {
                    btn.classList.add('active-touch');
                }, { passive: true });
                btn.addEventListener('touchend', () => {
                    btn.classList.remove('active-touch');
                }, { passive: true });
                btn.addEventListener('touchcancel', () => {
                    btn.classList.remove('active-touch');
                }, { passive: true });
            });

            hintMenu.onclick = e => {
                e.stopPropagation();
                suppressBodyTapUntil = Date.now() + 300;
                md.classList.remove('active');
                hh = !hh;
                _applyHintState();
                _x();
                _z(hh ? 'bottom hint hidden' : 'bottom hint shown', 2000);
            };

            lbMenu.onclick = e => {
                e.stopPropagation();
                suppressBodyTapUntil = Date.now() + 300;
                md.classList.remove('active');
                switcher.classList.remove('active');
                _syncSwitcherOpenState();
                lk = true;
                d.body.classList.add('locked');
                lo.classList.add('active');
                if (navigator.vibrate) navigator.vibrate(50)
            };

            fsMenu.onclick = e => {
                e.stopPropagation();
                suppressBodyTapUntil = Date.now() + 300;
                md.classList.remove('active');
                if (!d.fullscreenElement) d.documentElement.requestFullscreen().catch(() => { });
                else d.exitFullscreen().catch(() => { })
            };

            function triggerSetGoal() {
                if (d.activeElement && typeof d.activeElement.blur === 'function') {
                    d.activeElement.blur();
                }
                setTimeout(() => {
                    const r = prompt('Set Target Goal (current: ' + (gl || 'none') + '). Enter 0 to remove.', gl || '');
                    _dismissMobileKeyboard();
                    setTimeout(_dismissMobileKeyboard, 150);
                    setTimeout(_dismissMobileKeyboard, 350);
                    if (r !== null) {
                        const n = parseInt(r);
                        if (!isNaN(n) && n >= 0) {
                            gl = n;
                            if (gl > 0) {
                                v = 0;
                                _z(`goal set to ${gl}`, 2000);
                            } else {
                                _z('goal removed', 2000);
                            }
                            _w();
                            _x();
                        }
                    }
                }, 60);
            }

            goalMenu.onclick = e => {
                e.stopPropagation();
                suppressBodyTapUntil = Date.now() + 300;
                md.classList.remove('active');
                triggerSetGoal();
            };

            let sx = 0, cx = 0;
            sh.addEventListener('touchstart', e => {
                sx = e.touches[0].clientX;
                sh.style.transition = ''
            });

            sh.addEventListener('touchmove', e => {
                const dx = e.touches[0].clientX - sx,
                    mx = lo.offsetWidth - sh.offsetWidth - 16;
                cx = Math.max(0, Math.min(dx, mx));
                sh.style.transform = `translateX(${cx}px)`;
                if (cx >= mx * .98) {
                    lk = false;
                    d.body.classList.remove('locked');
                    lo.classList.remove('active');
                    sh.style.transform = 'translateX(0)';
                    if (navigator.vibrate) navigator.vibrate([10, 30, 10])
                }
            });

            sh.addEventListener('touchend', () => {
                if (lk) {
                    sh.style.transition = 'transform .4s cubic-bezier(.175,.885,.32,1.275)';
                    sh.style.transform = 'translateX(0)'
                }
            });

            let gsx = 0, gcx = 0, gDragging = false;

            function _completeGoalTurnOff() {
                gDragging = false;
                gl = 0;
                isLockout = false;
                d.body.classList.remove('lockout-active');
                go.classList.remove('active');
                gsh.style.transition = '';
                gsh.style.transform = 'translateX(0)';
                if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
                _w();
                _x();
                setTimeout(() => _z('goal removed', 2000), 200);
            }

            function _onGoalSlideStart(clientX) {
                if (!isLockout) return;
                gDragging = true;
                gsx = clientX;
                gsh.style.transition = '';
            }

            function _onGoalSlideMove(clientX) {
                if (!gDragging || !isLockout) return;
                const mx = go.offsetWidth - gsh.offsetWidth - 16;
                gcx = Math.max(0, Math.min(clientX - gsx, mx));
                gsh.style.transform = `translateX(${gcx}px)`;
                if (gcx >= mx * 0.96) {
                    _completeGoalTurnOff();
                }
            }

            function _onGoalSlideEnd() {
                if (!gDragging) return;
                gDragging = false;
                if (isLockout) {
                    gsh.style.transition = 'transform .4s cubic-bezier(.175,.885,.32,1.275)';
                    gsh.style.transform = 'translateX(0)';
                }
            }

            gsh.addEventListener('touchstart', e => {
                e.stopPropagation();
                _onGoalSlideStart(e.touches[0].clientX);
            }, { passive: true });

            gsh.addEventListener('touchmove', e => {
                e.stopPropagation();
                _onGoalSlideMove(e.touches[0].clientX);
            }, { passive: true });

            gsh.addEventListener('touchend', e => {
                e.stopPropagation();
                _onGoalSlideEnd();
            });

            gsh.addEventListener('mousedown', e => {
                e.stopPropagation();
                _onGoalSlideStart(e.clientX);
            });

            w.addEventListener('mousemove', e => {
                if (gDragging) _onGoalSlideMove(e.clientX);
            });

            w.addEventListener('mouseup', () => {
                if (gDragging) _onGoalSlideEnd();
            });

            f.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    f.blur()
                }
            });

            d.body.addEventListener('touchstart', e => {
                if (lk || isLockout) return;
                _u();
                if (!wakeLock) _requestWakeLock();
                if (e.target.closest('.a2') || e.target.closest('.a1') || e.target.closest('.b3') || e.target.closest('#undo-toast') || e.target.closest('#counter-switcher') || e.target.closest('#lock-overlay') || e.target.closest('#goal-overlay')) return;
                nx = e.touches[0].clientX;
                ny = e.touches[0].clientY;
                pt = setTimeout(() => {
                    sn = !sn;
                    qf = 1;
                    _x();
                    if (navigator.vibrate) navigator.vibrate(50);
                    _z(sn ? 'Sound off' : 'Sound on', 2000)
                }, 800)
            });

            d.body.addEventListener('touchend', e => {
                if (lk || isLockout) return;
                if (e.target.closest('.a2') || e.target.closest('.a1') || e.target.closest('.b3') || e.target.closest('#undo-toast') || e.target.closest('#counter-switcher') || e.target.closest('#lock-overlay') || e.target.closest('#goal-overlay')) return;
                if (pt) { clearTimeout(pt); pt = null }
                if (qf) { qf = 0; return }
                if (f.contentEditable === 'true') { f.blur(); return }

                const dx = nx - e.changedTouches[0].clientX,
                    dy = ny - e.changedTouches[0].clientY;

                if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
                    suppressBodyTapUntil = Date.now() + 350;
                    _incrementCounter();
                } else if (Math.abs(dx) > Math.abs(dy)) {
                    suppressBodyTapUntil = Date.now() + 350;
                    if (dx > 50) {
                        if (v === 0) {
                            _z('counter already 0', 1800);
                            return;
                        }
                        const prevValue = v;
                        const targetCounterId = activeId;
                        const targetCounterName = currentCounter.name;
                        setTimeout(() => {
                            const confirmed = w.confirm(`Reset "${targetCounterName}" (${prevValue.toLocaleString('en-US')}) to 0?`);
                            if (!confirmed) return;
                            if (navigator.vibrate) navigator.vibrate(40);
                            const targetObj = counters.find(c => c.id === targetCounterId);
                            if (targetObj) targetObj.v = 0;
                            if (activeId === targetCounterId) {
                                v = 0;
                                _w();
                            }
                            _x();
                            _showUndoToast(`Reset to 0 (was ${prevValue.toLocaleString('en-US')})`, () => {
                                const restoreObj = counters.find(c => c.id === targetCounterId);
                                if (!restoreObj) return;
                                restoreObj.v = prevValue;
                                if (activeId === targetCounterId) {
                                    v = prevValue;
                                    _w();
                                }
                                _x();
                                _z('reset undone', 2000);
                            }, 5500);
                        }, 30);
                    } else if (dx < -50) {
                        const r = prompt('Set Increment (current: ' + st + ')', st);
                        _dismissMobileKeyboard();
                        setTimeout(_dismissMobileKeyboard, 150);
                        setTimeout(_dismissMobileKeyboard, 350);
                        if (r !== null) {
                            const n = parseInt(r);
                            st = (!isNaN(n) && n > 0) ? n : 1;
                            _z(`increment set to ${st}`, 2000);
                            _w(); _x()
                        }
                    }
                } else {
                    suppressBodyTapUntil = Date.now() + 350;
                    if (dy > 50) {
                        f.contentEditable = 'true';
                        f.focus();
                        const r = d.createRange(), s = w.getSelection();
                        r.selectNodeContents(f); r.collapse(!1);
                        s.removeAllRanges(); s.addRange(r)
                    } else if (dy < -50) {
                        if (v > 0) {
                            const targetCounterId = activeId;
                            const targetCounterName = currentCounter.name;
                            const currentVal = v;
                            setTimeout(() => {
                                const confirmed = w.confirm(`Subtract 1 from "${targetCounterName}" (${currentVal.toLocaleString('en-US')} → ${(currentVal - 1).toLocaleString('en-US')})?`);
                                if (!confirmed) return;
                                if (navigator.vibrate) navigator.vibrate(40);
                                const targetObj = counters.find(c => c.id === targetCounterId);
                                if (targetObj && targetObj.v > 0) targetObj.v -= 1;
                                if (activeId === targetCounterId && v > 0) {
                                    v = v - 1;
                                    _p(v);
                                    _w();
                                }
                                _x();
                                _z('number subtracted', 2000);
                            }, 30);
                        }
                    }
                }
            });

            d.addEventListener('fullscreenchange', () => {
                d.body.classList.toggle('f', !!d.fullscreenElement)
            });

            f.onblur = () => {
                f.contentEditable = 'false';
                let r = f.textContent.replace(/[^\d]/g, '');
                v = r === '' ? 0 : parseInt(r);
                _w(); _x(); _u()
            };

            _w();
            _x();
            stt = setTimeout(() => { i.classList.add('v') }, 0)
        })()
    </script>
</body>
</html>
